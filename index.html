<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Portfolio de Thomas Caron, développeur logiciel full-stack et QA."
    />
    <meta name="theme-color" content="#c4d8de" />
    <script>
      // Applique le thème avant le premier rendu pour éviter tout flash.
      // Priorité : choix explicite mémorisé, sinon préférence du système.
      try {
        var stored = window.localStorage.getItem("portfolio-theme");
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) {
          document.documentElement.dataset.theme = "dark";
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", "#081721");
        }
      } catch {
        // Le thème clair reste le thème par défaut.
      }
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Thomas Caron — Développeur logiciel" />
