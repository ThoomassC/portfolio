<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Portfolio de Thomas Caron, développeur logiciel full-stack et QA."
    />
    <!-- Aligné sur THEME_COLORS de src/hooks/useTheme.ts et sur le fond de page CSS. -->
    <meta name="theme-color" content="#f7f4ea" />
    <link
      rel="preload"
      href="/assets/fonts/anton-latin.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <script>
      // Applique le thème avant le premier rendu pour éviter tout flash.
      // Priorité : choix explicite mémorisé, sinon préférence du système.
      try {
        var stored = window.localStorage.getItem("portfolio-theme");
        var dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#192139");
          document
            .querySelector('link[rel="icon"][type="image/svg+xml"]')
            ?.setAttribute("href", "/assets/favicon-dark.svg");
          document
            .querySelector('link[rel="icon"][type="image/x-icon"]')
            ?.setAttribute("href", "/assets/favicon-dark.ico");
        }
      } catch {
        // Le thème clair reste le thème par défaut.
      }
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Thomas Caron — Développeur logiciel" />
    <meta
      property="og:description"
      content="Développeur logiciel full-stack et QA, de la conception aux tests automatisés."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/assets/og-portrait-cobalt-v1.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Portrait de Thomas Caron — Développeur logiciel, Full-stack · QA, sur fond ivoire et cobalt." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/assets/og-portrait-cobalt-v1.jpg" />
    <meta name="twitter:image:alt" content="Portrait de Thomas Caron — Développeur logiciel, Full-stack · QA, sur fond ivoire et cobalt." />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <title>Thomas Caron — Développeur logiciel</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Thomas Caron",
        "jobTitle": "Développeur logiciel full-stack et QA",
        "url": "%VITE_SITE_URL%/",
        "image": "%VITE_SITE_URL%/assets/og-portrait-cobalt-v1.jpg",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Mont-Saint-Aignan",
          "addressCountry": "FR"
        },
        "sameAs": ["https://www.linkedin.com/in/thomas-caron27/", "https://github.com/ThoomassC"],
        "knowsAbout": [
          "C#",
          "Angular",
          "Java",
          "Selenium",
          "Cucumber",
          "Swift",
          "TypeScript",
          "React",
          "Tests automatisés"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
